<html>

<form action='./' method='post'>

<font color='red'>html5_pattern</font>
<hr />

<input type="text" name="plain" pattern="[A-Z]+/[0-9]+" />
<input type="text" name="escaped" pattern="[A-Z]+\/[0-9]+" />
<input type="text" name="noslash" pattern="^[0-9]{3}-[0-9]{4}$" />
<input type="text" name="hash" pattern="a#b" />
<input type="text" name="backslash" pattern='abc\' />

</form>

</html>
